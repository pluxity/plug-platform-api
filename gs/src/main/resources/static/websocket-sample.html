<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>test</title>
</head>
<body>
<div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.0/axios.min.js"></script>
<script>
    let stompClient;

    const login = () => {
        axios
            .post(`http://${getServerInfo()}/auth/sign-in`,
                {
                    username: 'moon',
                    password: 'qwer1234'
                },
                {
                    headers: {
                        "Content-Type": `application/json`,
                    }
                }
            )
            .then((response) => {
                console.log(response);
                stompInit();
            })
            .catch((error) => {
                console.log("", error);
            });
    }

    const stompInit = () => {
        const socket = new WebSocket(`ws://${getServerInfo()}/stomp/platform`);
        stompClient = Stomp.over(socket);

        const onConnect = async (payload) => {
            stompClient.subscribe(`/user/queue/test-message`, function (data) {
                console.log(data)
            });

            stompClient.send(`/app/test/message`, {}, JSON.stringify({
                message: '테스트 메시지 입니다.'
            }));
        };
        const onError = (error) => console.log("connect error", error);
        stompClient.connect({}, onConnect, onError);
    };

    const getServerInfo = () => {
        return location.href.substring(0, location.href.lastIndexOf("/")).replace("http://", "");
    }

    login();
</script>
</body>
</html>
