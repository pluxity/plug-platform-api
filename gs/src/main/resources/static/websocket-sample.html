<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>Scenario Execution Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        button { margin: 5px; padding: 10px 20px; cursor: pointer; }
        input { padding: 8px; width: 200px; }
        #log { background: #f5f5f5; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .log-entry { margin: 2px 0; }
        .log-receive { color: green; }
        .log-send { color: blue; }
        .log-error { color: red; }
    </style>
</head>
<body>
<h2>WebSocket Test</h2>

<div class="section">
    <h3>Log</h3>
    <div id="log"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.0/axios.min.js"></script>
<script>
    let stompClient;

    const log = (message, type = '') => {
        const logDiv = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = 'log-entry ' + type;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(message);
    };

    const login = () => {
        log('Logging in...');
        axios
            .post(`http://${getServerInfo()}/auth/sign-in`,
                {
                    username: 'string',
                    password: 'string'
                },
                {
                    headers: {
                        "Content-Type": `application/json`,
                    }
                }
            )
            .then((response) => {
                log('Login successful');
                stompInit();
            })
            .catch((error) => {
                log(`Login failed: ${error}`, 'log-error');
            });
    };

    const stompInit = () => {
        const socket = new WebSocket(`ws://${getServerInfo()}/stomp/platform`);
        stompClient = Stomp.over(socket);

        const onConnect = async (payload) => {
            log('WebSocket connected');

            stompClient.subscribe('/user/queue/scenario-execution', function (message) {
                const body = JSON.parse(message.body);
                log(`RECEIVE /user/queue/scenario-execution: ${JSON.stringify(body)}`, 'log-receive');
            });

            log('Subscribed to /user/queue/scenario-execution');

            stompClient.subscribe(`/user/queue/test-message`, function (data) {
                console.log(data)
            });

            stompClient.send(`/app/test/message`, {}, JSON.stringify({
                message: '테스트 메시지 입니다.'
            }));

        };

        const onError = (error) => {
            log(`WebSocket error: ${error}`, 'log-error');
        };

        stompClient.connect({}, onConnect, onError);
    };

    const getServerInfo = () => {
        return location.href.substring(0, location.href.lastIndexOf("/")).replace("http://", "");
    };

    login();
</script>
</body>
</html>
