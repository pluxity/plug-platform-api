<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>Scenario Execution Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        button { margin: 5px; padding: 10px 20px; cursor: pointer; }
        input { padding: 8px; width: 200px; }
        #log { background: #f5f5f5; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .log-entry { margin: 2px 0; }
        .log-receive { color: green; }
        .log-send { color: blue; }
        .log-error { color: red; }
    </style>
</head>
<body>
<h2>Scenario Execution WebSocket Test</h2>

<div class="section">
    <h3>Controls</h3>
    <label>Scenario Execution ID: <input type="number" id="executionId" value="1"/></label>
    <br/><br/>
    <button onclick="sendStart()">Start</button>
    <button onclick="sendComplete(true)">Complete (Success)</button>
    <button onclick="sendComplete(false)">Complete (Fail)</button>
    <button onclick="sendCancel()">Cancel</button>
</div>

<div class="section">
    <h3>Log</h3>
    <div id="log"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.0/axios.min.js"></script>
<script>
    let stompClient;

    const log = (message, type = '') => {
        const logDiv = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = 'log-entry ' + type;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(message);
    };

    const getExecutionId = () => {
        return parseInt(document.getElementById('executionId').value);
    };

    const sendStart = () => {
        const payload = { scenarioExecutionId: getExecutionId() };
        stompClient.send('/app/scenario/execution/start', {}, JSON.stringify(payload));
        log(`SEND /app/scenario/execution/start: ${JSON.stringify(payload)}`, 'log-send');
    };

    const sendComplete = (success) => {
        const payload = {
            scenarioExecutionId: getExecutionId(),
            success: success,
            errorMessage: success ? null : 'Test error message'
        };
        stompClient.send('/app/scenario/execution/complete', {}, JSON.stringify(payload));
        log(`SEND /app/scenario/execution/complete: ${JSON.stringify(payload)}`, 'log-send');
    };

    const sendCancel = () => {
        const payload = { scenarioExecutionId: getExecutionId() };
        stompClient.send('/app/scenario/execution/cancel', {}, JSON.stringify(payload));
        log(`SEND /app/scenario/execution/cancel: ${JSON.stringify(payload)}`, 'log-send');
    };

    const login = () => {
        log('Logging in...');
        axios
            .post(`http://${getServerInfo()}/auth/sign-in`,
                {
                    username: 'user',
                    password: 'password'
                },
                {
                    headers: {
                        "Content-Type": `application/json`,
                    }
                }
            )
            .then((response) => {
                log('Login successful');
                stompInit();
            })
            .catch((error) => {
                log(`Login failed: ${error}`, 'log-error');
            });
    };

    const stompInit = () => {
        const socket = new WebSocket(`ws://${getServerInfo()}/stomp/platform`);
        stompClient = Stomp.over(socket);

        const onConnect = async (payload) => {
            log('WebSocket connected');

            stompClient.subscribe('/topic/scenario-execution', function (message) {
                const body = JSON.parse(message.body);
                log(`RECEIVE /topic/scenario-execution: ${JSON.stringify(body)}`, 'log-receive');
            });

            log('Subscribed to /topic/scenario-execution');
        };

        const onError = (error) => {
            log(`WebSocket error: ${error}`, 'log-error');
        };

        stompClient.connect({}, onConnect, onError);
    };

    const getServerInfo = () => {
        return location.href.substring(0, location.href.lastIndexOf("/")).replace("http://", "");
    };

    login();
</script>
</body>
</html>
